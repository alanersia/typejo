name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mojo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system mojo==1.1.0
      - run: mojo --version
      - run: mojo -I . tests/test_primitives.mojo
      - run: mojo -I . tests/test_composites.mojo
      - run: mojo -I . tests/test_json.mojo
      - run: mojo -I . examples/primitives.mojo
      - run: mojo -I . examples/models.mojo
      - run: mojo -I . examples/json.mojo
